[package]
name = "drift"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
drift-app = { version = "0.1.0", path = "../app" }
drift-core = { version = "0.1.0", path = "../core" }
drift-net = { version = "0.1.0", path = "../net" }
mdns-sd = "0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target."cfg(windows)".dependencies]
drift-platform-win = { version = "0.1.0", path = "../platform-win" }
