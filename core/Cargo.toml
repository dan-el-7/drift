[package]
name = "drift-core"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8"
base64 = "0.22"
bytes = "1.12.1"
cbc = "0.1"
cipher = { version = "0.4", features = ["std", "block-padding"] }
hkdf = "0.12"
hmac = "0.12"
md-5 = "0.10"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
prost = "0.14.6"
prost-types = "0.14"
rand = "0.8"
sha2 = "0.10"
thiserror = "2.0.21"

[build-dependencies]
prost-build = "0.14.6"
protoc-bin-vendored = "3.3.0"

# Phones: hardware SHA-256 (ARMv8 crypto extensions) for the HMAC on every chunk. sha2 0.10 compiles
# the aarch64 path only with "asm"; without it, it's software. Detected at run time (cpufeatures).
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }
