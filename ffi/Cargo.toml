[package]
name = "drift-ffi"
version = "0.1.0"
edition = "2024"
description = "C ABI over the Drift core for the native UIs (JSON events and commands)"

[lib]
name = "drift_ffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
drift-app = { version = "0.1.0", path = "../app" }
drift-core = { version = "0.1.0", path = "../core" }
drift-net = { version = "0.1.0", path = "../net" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target."cfg(windows)".dependencies]
drift-platform-win = { version = "0.1.0", path = "../platform-win" }
windows = { version = "0.62", features = ["Win32_System_WinRT"] }

[target."cfg(target_os = \"android\")".dependencies]
jni = "0.21.1"
rand = "0.8"
